name: Method compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shell syntax, installer, registry, hooks, rules and docs
        run: bash tests/test-install.sh
      - name: Whitespace
        run: git diff --check
